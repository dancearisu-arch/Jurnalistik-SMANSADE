<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atur Kata Sandi — Jurnalistik Smansade</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="ruang.css"></head><body><header class="nav wrap"><a class="brand" href="index.html"><span class="logo"><img src="LOGO.png" alt="Logo Jurnalistik Smansade"></span> jurnalistik <span style="color:var(--green)">smansade</span></a><a class="button" href="index.html">Kembali</a></header><div class="menu-backdrop"></div><main class="wrap" style="min-height:70vh;display:grid;place-items:center"><section class="panel" style="width:min(480px,100%);padding:30px"><div class="kicker">Pemulihan akun</div><h1 style="font:800 32px Manrope;margin:10px 0">Atur kata sandi baru.</h1><p style="color:var(--muted);line-height:1.6">Tautan ini hanya dapat digunakan sekali dan kedaluwarsa dalam 30 menit.</p><form id="resetForm"><label>Kata sandi baru<span class="password-field"><input class="field" name="password" type="password" minlength="8" required placeholder="Minimal 8 karakter"><button type="button" class="password-toggle" id="toggle">Lihat</button></span></label><div class="password-strength" aria-live="polite" id="strength">Gunakan minimal 8 karakter.</div><label style="display:block;margin-top:14px">Ulangi kata sandi<span class="password-field"><input class="field" name="confirm" type="password" minlength="8" required placeholder="Ketik ulang kata sandi"><button type="button" class="password-toggle" id="toggleConfirm">Lihat</button></span></label><button class="primary" style="width:100%;margin-top:14px">Simpan kata sandi</button></form><p id="result" role="status" aria-live="polite" style="display:none;margin-top:14px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--green) 10%,var(--paper));font-size:13px"></p></section></main><script>const passwordInput=document.querySelector('[name=password]'),confirmInput=document.querySelector('[name=confirm]'),strength=document.querySelector('#strength');function bindEye(id,input){document.querySelector(id).onclick=()=>{input.type=input.type==='password'?'text':'password';document.querySelector(id).textContent=input.type==='password'?'Lihat':'Sembunyikan'}}bindEye('#toggle',passwordInput);bindEye('#toggleConfirm',confirmInput);confirmInput.addEventListener('input',()=>confirmInput.setCustomValidity(''));passwordInput.addEventListener('input',()=>{const v=passwordInput.value;const score=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/[0-9]/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;strength.textContent=v.length===0?'Gunakan minimal 8 karakter.':score<=2?'Kekuatan: perlu diperkuat':score<=4?'Kekuatan: cukup':'Kekuatan: kuat';strength.dataset.level=score<=2?'low':score<=4?'mid':'high'});document.querySelector('#resetForm').onsubmit=async e=>{e.preventDefault();if(passwordInput.value!==confirmInput.value){confirmInput.setCustomValidity('Kedua kata sandi belum sama.');confirmInput.reportValidity();return}confirmInput.setCustomValidity('');const submit=e.target.querySelector('button[type=submit],button:not([type])');submit.disabled=true;submit.textContent='Menyimpan…';let token=new URLSearchParams(location.search).get('token');try{let r=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:passwordInput.value,token})});let d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal.');let p=document.querySelector('#result');p.textContent=d.message+' Kamu sekarang bisa masuk dengan kata sandi baru.';p.style.display='block';e.target.style.display='none'}catch(err){let p=document.querySelector('#result');p.textContent=err.message;p.style.display='block';submit.disabled=false;submit.textContent='Simpan kata sandi'}};</script><script>(function(){const button=document.querySelector('.nav-toggle'),menu=document.querySelector('.nav .links'),backdrop=document.querySelector('.menu-backdrop');if(!button||!menu)return;function close(){menu.classList.remove('open');document.body.classList.remove('menu-open');button.setAttribute('aria-expanded','false');button.textContent='☰';menu.setAttribute('aria-hidden',String(window.matchMedia('(max-width:760px)').matches))}function open(){menu.classList.add('open');document.body.classList.add('menu-open');button.setAttribute('aria-expanded','true');button.textContent='×';menu.setAttribute('aria-hidden','false');menu.querySelector('a')?.focus()}button.addEventListener('click',()=>menu.classList.contains('open')?close():open());backdrop?.addEventListener('click',close);menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});menu.setAttribute('aria-hidden',String(window.matchMedia('(max-width:760px)').matches));window.matchMedia('(max-width:760px)').addEventListener('change',e=>menu.setAttribute('aria-hidden',String(e.matches)));})();</script><script src="account-menu.js" defer></script></body></html>
