<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baca tulisan — Jurnalistik Smansade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="ruang.css">
</head>
<body>
<header class="nav wrap"><button class="nav-toggle" aria-label="Buka menu" aria-expanded="false">☰</button><a class="brand" href="index.html"><span class="logo"><img src="LOGO.png" alt="Logo Jurnalistik Smansade"></span> jurnalistik <span style="color:var(--green)">smansade</span></a><nav class="links"><a href="index.html">Beranda</a><a href="dokumentasi.html">Dokumentasi</a><a href="artikel.html">Artikel</a><a href="liputan.html">Liputan</a><a href="karya-siswa.html">Karya siswa</a><a href="suara-siswa.html">Suara siswa</a><a href="leaderboard.html">Leaderboard</a></nav><div class="navright"><button class="iconbtn" id="theme" aria-label="Ganti tema">☾</button></div></header><div class="menu-backdrop"></div>
<main class="wrap"><section class="hero reader-hero"><div class="kicker">Ruang baca</div><p><a class="read-more" id="backLink" href="index.html">← Kembali</a></p></section><section class="reader-shell" id="reader"><div class="reader-paper reader-loading">Memuat tulisan…</div></section></main>
<footer class="footer wrap"><span>© 2026 Jurnalistik Smansade</span><a href="index.html">Kembali ke beranda ↑</a></footer>
<div class="notice" id="notice"></div>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={dokumentasi:'Dokumentasi',artikel:'Artikel',liputan:'Liputan',karya:'Karya siswa',suara:'Suara siswa'};
function setNotice(text){const n=document.querySelector('#notice');n.textContent=text;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3200)}
async function loadStory(){const box=document.querySelector('#reader');const id=new URLSearchParams(location.search).get('id');if(!id){box.innerHTML='<div class="reader-paper reader-loading">Tulisan tidak ditemukan. <a class="read-more" href="artikel.html">Kembali ke artikel</a></div>';return}try{const response=await fetch('/api/contents/'+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw Error(data.error||'Tulisan gagal dimuat.');const x=data.content;if(!x){box.innerHTML='<div class="reader-paper reader-loading">Tulisan tidak tersedia atau sudah dihapus. <a class="read-more" href="artikel.html">Kembali</a></div>';return}document.title=x.title+' — Jurnalistik Smansade';document.querySelector('#backLink').href=x.kind==='karya'?'karya-siswa.html':x.kind==='artikel'?'artikel.html':x.kind==='dokumentasi'?'dokumentasi.html':'index.html';let media='';if(x.file_name&&x.mime?.startsWith('image/'))media=`<img class="reader-cover" src="/uploads/${encodeURIComponent(x.file_name)}" alt="${esc(x.title)}">`;else if(x.file_name&&x.mime?.startsWith('video/'))media=`<video class="reader-cover-video" src="/uploads/${encodeURIComponent(x.file_name)}" controls playsinline></video>`;const stars=['dokumentasi','karya'].includes(x.kind)?`<div class="reader-meta">★ ${x.rating||'—'} dari 5 · ${x.rating_count||0} penilaian</div>`:'';const comments=x.comments?.length?`<section class="reader-comments"><h2>Komentar (${x.comments.length})</h2>${x.comments.map(c=>`<p><b>${esc(c.author)}</b> · ${new Date(c.created_at).toLocaleDateString('id-ID')}<br>${esc(c.body)}</p>`).join('')}</section>`:'';box.innerHTML=`<article class="reader-paper"><span class="chip">${esc(labels[x.kind]||x.kind)}</span><h1 class="reader-title">${esc(x.title)}</h1><div class="reader-meta">Oleh <b>${esc(x.author)}</b> · ${new Date(x.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>${media}${x.file_name&&!x.mime?.startsWith('image/')&&!x.mime?.startsWith('video/')?`<a class="button reader-download" href="/api/download/${x.id}">↓ Unduh lampiran ${esc(x.original_name||'')}</a>`:''}${stars}<div class="reader-content">${x.body}</div>${comments}</article>`}catch(e){box.innerHTML=`<div class="reader-paper reader-loading">${esc(e.message)}<br><a class="read-more" href="artikel.html">Kembali ke daftar tulisan</a></div>`}}
loadStory();
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.querySelector('#theme').textContent=dark?'☀':'☾';localStorage.setItem('js-theme',dark?'dark':'light')};if(localStorage.getItem('js-theme')==='dark'){document.body.classList.add('dark');document.querySelector('#theme').textContent='☀'}
(function(){const button=document.querySelector('.nav-toggle'),menu=document.querySelector('.nav .links'),backdrop=document.querySelector('.menu-backdrop');if(!button||!menu)return;function close(){menu.classList.remove('open');document.body.classList.remove('menu-open');button.setAttribute('aria-expanded','false');button.textContent='☰'}function open(){menu.classList.add('open');document.body.classList.add('menu-open');button.setAttribute('aria-expanded','true');button.textContent='×'}button.addEventListener('click',()=>menu.classList.contains('open')?close():open());backdrop?.addEventListener('click',close);menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})();
</script>
<script src="account-menu.js" defer></script></body></html>
